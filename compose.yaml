services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"
      - "1025:1025"

  web:
    build:
      context: .
      target: dev
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
